[project]
name = "estudiantes-fastapi"
version = "0.1.0"
description = "CRUD en memoria de estudiantes y sus mascotas con FastAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "app"]